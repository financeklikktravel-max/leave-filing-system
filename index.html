<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klikk Travel — Leave Request Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Leave Request Form</h1>
    <p class="subtitle">Klikk Travel Inc.</p>

    <form id="leaveForm">
      <label for="name">Employee Name</label>
      <select id="name" name="name" required>
        <option value="" disabled selected>Select your name</option>
        <option value="Kenny Roy Santiago">Kenny Roy Santiago</option>
        <option value="ELLA JEAN GEOLAMEN">ELLA JEAN GEOLAMEN</option>
        <option value="NATASHA MONIQUE SY">NATASHA MONIQUE SY</option>
        <option value="ANDREW VICENTE">ANDREW VICENTE</option>
        <option value="JOHANAH MAE YAMBAO">JOHANAH MAE YAMBAO</option>
        <option value="Erine Jelle Cruz">Erine Jelle Cruz</option>
        <option value="Stephanie Santos">Stephanie Santos</option>
        <option value="Tania Virgino">Tania Virgino</option>
        <option value="June Grace Juanillo">June Grace Juanillo</option>
        <option value="Alyzza Marie Moreno">Alyzza Marie Moreno</option>
        <option value="Ivan John Paul Casio">Ivan John Paul Casio</option>
        <option value="Patricia Taguinod">Patricia Taguinod</option>
        <option value="Darrel Franz Forca">Darrel Franz Forca</option>
        <option value="KENNETH VARGAS">KENNETH VARGAS</option>
        <option value="Kristine Leila Suba">Kristine Leila Suba</option>
        <option value="Yvonne Ymata">Yvonne Ymata</option>
        <option value="Michael Angelo Payumo">Michael Angelo Payumo</option>
        <option value="DOREEN GAY PUNZALAN">DOREEN GAY PUNZALAN</option>
        <option value="JUSTINE MARK DELACRUZ">JUSTINE MARK DELACRUZ</option>
        <option value="Alexa Arcilla">Alexa Arcilla</option>
        <option value="Janine Raquel Realisan">Janine Raquel Realisan</option>
        <option value="Ma. Claire Cabintoy">Ma. Claire Cabintoy</option>
        <option value="Mariza Mae Soria">Mariza Mae Soria</option>
        <option value="John Terry Bagano Atilo">John Terry Bagano Atilo</option>
        <option value="Tadahiro Frias Roy">Tadahiro Frias Roy</option>
      </select>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="leaveType">Leave Type</label>
      <select id="leaveType" name="leaveType" required>
        <option value="" disabled selected>Select leave type</option>
        <option value="Leave With Pay">Leave With Pay</option>
        <option value="Leave W/O Pay">Leave W/O Pay</option>
        <option value="Sick Leave">Sick Leave</option>
      </select>

      <div class="row">
        <div>
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" name="startDate" required>
        </div>
        <div>
          <label for="endDate">End Date</label>
          <input type="date" id="endDate" name="endDate" required>
        </div>
      </div>

      <p id="daysPreview" class="days-preview hidden"></p>

      <label for="reason">Reason</label>
      <textarea id="reason" name="reason" rows="3" required></textarea>

      <button type="submit" id="submitBtn">Submit Request</button>
    </form>

    <div id="result" class="result hidden"></div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
